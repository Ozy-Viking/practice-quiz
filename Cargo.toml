[package]
name = "practice-quiz"
version = "0.1.0"
edition = "2024"

[dependencies]
dioxus = { version = "0.7", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = { version = "0.8", features = ["small_rng"] }
rand_chacha = "=0.3.1"
regex = "1"
url = "2"
dioxus-free-icons = { version = "0.10.0", features = ["lucide"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
web-sys = { version = "0.3", features = ["Window", "Location", "Navigator", "Clipboard", "Storage", "MediaQueryList", "Blob", "BlobPropertyBag", "Url", "Document", "HtmlElement", "HtmlAnchorElement", "Element", "Node"] }
wasm-bindgen-futures = "0.4"
wasm-bindgen = "0.2.123"
js-sys = "0.3.100"

[dev-dependencies]
rand = { version = "0.8", features = ["small_rng"] }
